[package]
name = "zeeks"
version = "0.2.0"
edition = "2021"
description = "ZEEKS - Audio vers Vidéo"

[[bin]]
name = "zeeks"
path = "src/main.rs"

[dependencies]
anyhow = "1"
eframe = "0.37"
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "gif",
    "webp",
    "bmp",
    "tiff",
] }
rfd = "0.18"
arboard = { version = "3.7", features = ["image-data"] }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Media",
    "Win32_Media_Audio",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_Networking_WinHttp",
    "Win32_UI_HiDpi",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
